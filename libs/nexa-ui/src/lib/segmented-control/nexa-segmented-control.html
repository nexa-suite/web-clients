<div class="segmented" [class.compact]="size() === 'compact'" role="group" [attr.aria-label]="label()">
  @for (option of options(); track option.value) {
    <button type="button" [class.selected]="selected() === option.value" [disabled]="option.disabled ?? false" [attr.aria-pressed]="selected() === option.value" (click)="choose(option)">{{ option.label }}</button>
  }
</div>
