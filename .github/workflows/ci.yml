name: Web clients CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  design-and-architecture:
    name: Design and architecture gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out web clients
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - name: Select locked npm version
        run: npm install --global npm@11.17.0

      - name: Install locked dependencies
        run: npm ci

      - name: Validate architecture and design tokens
        run: npm run validate:design

  unit-tests:
    name: Shared and app unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out web clients
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - name: Select locked npm version
        run: npm install --global npm@11.17.0

      - name: Install locked dependencies
        run: npm ci

      - name: Run shared and app unit tests
        run: npm test

  production-builds:
    name: Angular production builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out web clients
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - name: Select locked npm version
        run: npm install --global npm@11.17.0

      - name: Install locked dependencies
        run: npm ci

      - name: Build shared libraries and applications
        run: npm run build:all

  production-images:
    name: ${{ matrix.application }} production image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: Platform
            dockerfile: apps/platform/Dockerfile
            image: nexa-platform:ci
          - application: Portal
            dockerfile: apps/portal/Dockerfile
            image: nexa-portal:ci
    steps:
      - name: Check out web clients
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "${{ matrix.image }}" .

  api-integration:
    name: Real API and Platform browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXA_API_REPOSITORY_PATH: ${{ github.workspace }}/api
    steps:
      - name: Check out web clients
        uses: actions/checkout@v4

      - name: Check out the captured Nexa API source
        uses: actions/checkout@v4
        with:
          repository: nexa-suite/api
          # Signed API PR #128 candidate supplying the Buyer delivery policy.
          # This pin does not claim merge or deployment.
          ref: 0bb5c0c5fd5d210fa151c9ba126301eb31dce2ee
          path: api

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - name: Select locked npm version
        run: npm install --global npm@11.17.0

      - name: Install locked dependencies
        run: npm ci

      - name: Build shared Angular libraries for the browser integration
        run: npm run build:shared

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Set up Java 25 for Tenant fixture provisioning
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: api/pom.xml

      - name: Start API and prepare isolated Tenant Buyer fixtures
        working-directory: api
        run: GITHUB_WORKSPACE="$GITHUB_WORKSPACE/api" ./ops/scripts/prepare-security-load-compose-fixture.sh

      - name: Wait for the real API OpenAPI endpoint
        run: >-
          curl --fail --silent --show-error --retry 60 --retry-delay 5 --retry-connrefused
          http://127.0.0.1:8080/v3/api-docs -o /dev/null

      - name: Run Platform and Portal E2E against the real API
        env:
          NEXA_DEV_WORKSPACE_SLUG: icisa
        run: npm run test:e2e

      - name: Stop API worker and remove ephemeral volumes
        if: always() && env.NEXA_SECURITY_LOAD_COMPOSE_STARTED == 'true'
        working-directory: api
        run: |
          ./ops/compose/scripts/modern-down.sh
          docker compose --env-file .env.local -f ops/compose/modern.compose.yml down --volumes --remove-orphans
