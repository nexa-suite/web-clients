<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nexa Portal</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script id="stripe-return-query-cleanup">
      (() => {
        const query = new URLSearchParams(window.location.search);
        if (!query.has("payment_intent_client_secret") && !query.has("payment_intent")) return;
        query.delete("payment_intent_client_secret");
        query.delete("payment_intent");
        query.delete("redirect_status");
        const preservedQuery = query.toString();
        const cleanUrl = `${window.location.pathname}${preservedQuery ? `?${preservedQuery}` : ""}${window.location.hash}`;
        window.history.replaceState(window.history.state, "", cleanUrl);
      })();
    </script>
    <script src="runtime-config.js"></script>
  </head>
  <body>
    <portal-root></portal-root>
  </body>
</html>
